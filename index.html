<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickens County Traffic Camera</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      max-width: 640px;
      width: 100%;
      text-align: center;
    }
    video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      background-color: #000;
      outline: none;
    }
    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #e0e0e0;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>PICK-CCTV-0020 Live Feed</h2>
  <video id="videoPlayer" controls autoplay muted playsinline></video>
</div>

<script>
  // Points directly to your Render backend—no tokens needed on the frontend!
  const streamUrl = 'https://five11ga-backend.onrender.com/stream.m3u8';
  const video = document.getElementById('videoPlayer');

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(e => console.log('Autoplay blocked:', e));
    });

    // Auto-recover if a stream segment drops or token cycles
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        }
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = streamUrl;
    video.addEventListener('loadedmetadata', () => video.play());
  }
</script>

</body>
</html>
