<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickens County Traffic Camera</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      max-width: 680px;
      width: 100%;
      text-align: center;
    }
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 1.25rem;
      color: #e0e0e0;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>PICK-CCTV-0020 Live Feed</h2>
  <div class="video-container">
    <!-- Embeds the direct 511GA camera page view -->
    <iframe src="https://511ga.org/map/Cctv/19637" allowfullscreen></iframe>
  </div>
</div>

</body>
</html>
